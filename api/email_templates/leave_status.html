<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Leave Request Status</title>
</head>
<body style="font-family: Arial, sans-serif;">
    <div style="max-width: 600px; margin: auto; border: 1px solid #eee; padding: 24px;">
        <h2 style="color: #4CAF50;">Leave Request {{ status }}</h2>
        <p>Hello Dear,</p>
        <p>Your leave request for <strong>{{ leave_type }}</strong> from <strong>{{ start_date }}</strong> to <strong>{{ end_date }}</strong> has been <strong>{{ status }}</strong>.</p>
        <hr>
        <small style="color: #888;">This is an automated message from Leavey.</small>
    </div>
</body>
</html>
