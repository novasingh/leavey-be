<!-- api/email_templates/notification.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
</head>
<body style="font-family: Arial, sans-serif;">
    <div style="max-width: 600px; margin: auto; border: 1px solid #eee; padding: 24px;">
        <h2 style="color: #4CAF50;">{{ title }}</h2>
        <p>{{ message }}</p>
        <hr>
        <small style="color: #888;">This is an automated notification from Leavey.</small>
    </div>
</body>
</html>
